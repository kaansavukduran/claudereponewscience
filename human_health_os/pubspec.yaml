name: human_health_os
description: "Human OS - local-first personal health operating system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Dependency policy: every non-SDK package needs a recorded review in
# project_state/DECISIONS.md (license, maintenance, platform support, native code, privacy).
dependencies:
  crypto: ^3.0.7
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # D-016: Argon2id + ChaCha20-Poly1305 for the encrypted vault (F006).
  pointycastle: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Aion, the owner's own Human OS character (A001, D-029): a still picture
  # from the owner's reference sheet, included at the owner's request.
  assets:
    - assets/aion/
  # Reading fonts (U011, D-025): SIL Open Font License 1.1, licence texts
  # beside the files; bundled so they work offline.
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
