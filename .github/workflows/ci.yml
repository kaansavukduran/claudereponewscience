name: ci

# Each platform is judged on its own host. A Linux pass never stands in for Windows/macOS/iOS.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  ts-reference-and-build-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 tools/verify_contracts.py
      - run: pnpm build
      - run: pnpm --filter @hhos/site exec playwright install --with-deps chromium
      - run: pnpm --filter @hhos/site e2e
      - run: pnpm --filter @hhos/client e2e

  flutter-linux-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human_health_os
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --dart-define=APP_ENV=development --dart-define=SOURCE_REVISION=${{ github.sha }}
      - run: flutter build linux --release --dart-define=APP_ENV=development
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd .. && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && node tools/flutter_web_smoke.mjs

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human_health_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --dart-define=APP_ENV=development
      - run: flutter build appbundle --debug --dart-define=APP_ENV=development

  flutter-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: human_health_os
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build windows --release --dart-define=APP_ENV=development
      # Portable packaging (ZIP + portable_mode.json + UserData vault) is added in FORGE 030.

  flutter-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: human_health_os
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --dart-define=APP_ENV=development
      - run: flutter build ios --release --no-codesign --dart-define=APP_ENV=development
