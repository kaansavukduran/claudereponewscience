name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 tools/verify_contracts.py
      - run: pnpm build
      - run: pnpm --filter @hhos/site exec playwright install --with-deps chromium
      - run: pnpm --filter @hhos/site e2e
      - run: pnpm --filter @hhos/client e2e
