name: downloads

# Builds each platform on its own host and preserves every pre-release.
# A unique tag per run keeps old downloads and tags intact.
# Windows is in windows-exe.yml. Development builds for testing, not signed
# for any store; iOS needs an Apple developer signing identity (not built).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "human_health_os/**"
      - ".github/workflows/downloads.yml"

env:
  FLUTTER_VERSION: "3.47.6"
  # One increasing version per build of main (never reused), so every
  # pre-release keeps its own name and older downloads stay as they were.
  RELEASE_VERSION: "0.1.0-dev.${{ github.run_number }}"
  DEFINES: --dart-define=APP_ENV=development --dart-define=APP_VERSION=0.1.0-dev.${{ github.run_number }}

permissions:
  contents: write

# Serialize publishing on each branch. Previous releases are never deleted.
concurrency:
  group: downloads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    # Ubuntu 22.04 keeps the glibc floor low (D-008).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build clang cmake pkg-config
      - name: Build
        working-directory: human_health_os
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --release $DEFINES --dart-define=SOURCE_REVISION=${{ github.sha }}
      - name: Pack
        run: |
          mkdir -p dist/Human-OS
          cp -r human_health_os/build/linux/x64/release/bundle/. dist/Human-OS/
          printf 'Run ./human_health_os in this folder (or double-click it in your file manager).\nDevelopment build for testing: data is stored unencrypted under ~/.local/share/human-health-os.\n' > dist/Human-OS/README.txt
          tar -C dist -czf dist/Human-OS-${{ env.RELEASE_VERSION }}-linux-x64.tar.gz Human-OS
      - name: Check the binary starts
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a timeout 10 dist/Human-OS/human_health_os; code=$?; [ $code -eq 124 ] || { echo "exited early with $code"; exit 1; }
        shell: bash {0}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${RELEASE_VERSION}-linux-${{ github.run_id }}-${{ github.run_attempt }}" dist/Human-OS-${{ env.RELEASE_VERSION }}-linux-x64.tar.gz --prerelease --target "${{ github.sha }}" \
            --title "Human OS for Linux (development build)" \
            --notes "Built from ${{ github.sha }} on Ubuntu 22.04. Extract (tar -xzf), then run ./Human-OS/human_health_os. Needs GTK 3. Development build for testing: data is stored unencrypted; do not keep real health data you cannot lose."

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build
        working-directory: human_health_os
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release $DEFINES --dart-define=SOURCE_REVISION=${{ github.sha }}
          mkdir -p ../dist && cp build/app/outputs/flutter-apk/app-release.apk ../dist/Human-OS-${{ env.RELEASE_VERSION }}-android.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${RELEASE_VERSION}-android-${{ github.run_id }}-${{ github.run_attempt }}" dist/Human-OS-${{ env.RELEASE_VERSION }}-android.apk --prerelease --target "${{ github.sha }}" \
            --title "Human OS for Android (development build)" \
            --notes "Built from ${{ github.sha }}. Open this page on the phone, tap Human-OS-${{ env.RELEASE_VERSION }}-android.apk, then allow installing from this source when Android asks. Signed with a development key that changes with every build, not from Google Play: to install a newer build, remove the old one first (its data on the phone is removed with it). Development build for testing: do not keep real health data you cannot lose. Not run on a phone by the build."

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build
        working-directory: human_health_os
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release $DEFINES --dart-define=SOURCE_REVISION=${{ github.sha }}
          mkdir -p ../dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/human_health_os.app" ../dist/Human-OS-${{ env.RELEASE_VERSION }}-macos.zip
      - name: Check the app starts
        run: |
          app="human_health_os/build/macos/Build/Products/Release/human_health_os.app/Contents/MacOS/human_health_os"
          "$app" & pid=$!; sleep 10
          kill -0 $pid || { echo "exited early"; exit 1; }
          kill $pid
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${RELEASE_VERSION}-macos-${{ github.run_id }}-${{ github.run_attempt }}" dist/Human-OS-${{ env.RELEASE_VERSION }}-macos.zip --prerelease --target "${{ github.sha }}" \
            --title "Human OS for macOS (development build)" \
            --notes "Built from ${{ github.sha }}. Unzip, move human_health_os.app to Applications, then right-click it and choose Open (the app is not signed or notarized, so macOS asks once). Development build for testing: do not keep real health data you cannot lose."
